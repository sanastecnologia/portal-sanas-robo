name: Revisar vídeo editado
# Baixa um Reels já editado (arquivo do Drive compartilhado por link) e publica uma prévia leve
# no branch "revisao": mosaico de quadros, vídeo em 480p e as informações técnicas.
on:
  workflow_dispatch:
    inputs:
      drive:
        description: 'ID do arquivo no Drive'
        required: true
permissions:
  contents: write
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Prévia
        env:
          ARQ: ${{ inputs.drive }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p out && cd out
          curl -sSL -o video.mp4 "https://drive.usercontent.google.com/download?id=${ARQ}&export=download&confirm=t"
          ffprobe -v error -show_entries format=duration,size,bit_rate:stream=codec_name,width,height,r_frame_rate,sample_rate,channels -of default=nw=1 video.mp4 > info.txt
          ffmpeg -v error -i video.mp4 -vf "fps=1/3,scale=270:-2,tile=6x5" -frames:v 1 mosaico.jpg
          ffmpeg -v error -i video.mp4 -vf "scale=480:-2" -c:v libx264 -preset veryfast -crf 30 -c:a aac -b:a 96k previa.mp4
          ffmpeg -v error -sseof -6 -i video.mp4 -vf "fps=2,scale=270:-2,tile=6x2" -frames:v 1 final.jpg
          ffmpeg -v error -i video.mp4 -af "silencedetect=n=-35dB:d=0.25" -f null - 2> silencios.txt || true
          ls -la
      - name: Publicar no branch revisao
        run: |
          cd out
          git init -q && git checkout -q -b revisao
          git config user.name "Robô Portal Sanas" && git config user.email "robo@portalsanas.local"
          git add . && git commit -qm "Prévia ${{ inputs.drive }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" revisao
