name: Teste de download (temporário)
on:
  push:
    paths: ['.github/workflows/teste-download.yml']
jobs:
  tiktok:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q -U yt-dlp && yt-dlp -o t.mp4 "https://www.tiktok.com/@leenabhushan/video/6748451240264420610" && test -s t.mp4
  instagram-reel:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q -U yt-dlp && yt-dlp -o i.mp4 "https://www.instagram.com/reel/CWqAgUZgCku/" && test -s i.mp4
  instagram-post:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q -U yt-dlp && yt-dlp -o p.mp4 "https://www.instagram.com/p/aye83DjauH/" && test -s p.mp4
